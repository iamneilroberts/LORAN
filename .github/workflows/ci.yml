# CI — run the checks that a person would otherwise have to remember to run.
#
# Five incidents in this project share one shape: something green was verified instead of the
# thing that shipped. Local `tsc` passed while the page crashed on load; a tunnel served a stale
# image; a test file broke `docker compose up --build` twice. This workflow exists to make the
# mechanical half of that automatic.
#
# DELIBERATELY NOT HERE: `npm run check:palette`, `tsc --noEmit` and `vite build` as separate
# steps. `frontend/package.json`'s `build` script already chains all three, and `Dockerfile:34`
# runs it — so the image build subsumes them. Duplicating them here would burn ~2 minutes and,
# worse, could drift from what the image actually does. The `build` job (added next) covers them.
#
# What the image build does NOT cover, and what this file is therefore for:
#   - the unit tests. `frontend/tsconfig.json` deliberately EXCLUDES tests so a broken test file
#     cannot fail the production image (D-064), and pytest is not installed in the runtime stage.
#     `scripts/test.sh` is the only thing that runs them.
#   - that the built page actually boots (the `smoke` job, added next).

name: CI

on:
  push:
    # Everything lands straight on `main` in this repo — no PRs, no branch protection — so
    # push-to-main is the honest match for how it is actually used.
    branches:
      - main
  # Lets a run be re-triggered by hand from the Actions tab without an empty commit.
  workflow_dispatch:

# Read-only: nothing in this workflow writes to the repo. The `publish` job would need
# `packages: write`, and would declare that on itself rather than widening this.
permissions:
  contents: read

jobs:
  test:
    # The counts are in the name on purpose: a suite that silently stops collecting tests still
    # reports "passed", and a job called "test" would happily go green on zero of them.
    name: test (208 frontend + 141 backend)
    runs-on: ubuntu-latest
    # The suite runs in ~10 s locally; the rest is toolchain setup. Anything past this is hung.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # Node 22 and Python 3.12 match the Dockerfile's two stages (node:22-slim, python:3.12-slim)
      # and the verified local toolchain. Testing on a version the image does not use would prove
      # the wrong thing.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # requirements-dev.txt is `-r requirements.txt` plus pytest, so this one install covers the
      # app and the test runner. pytest is kept out of requirements.txt on purpose: the image has
      # no reason to carry a test runner into production.
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      # tsc against tsconfig.test.json, then vitest, then pytest. Note there is no
      # `npm run cesium:assets` step: that copies Cesium's Workers/Assets into public/ for a
      # served build, and the unit tests do not read it — verified by running the suite in a
      # fresh worktree with no public/cesium present.
      - name: Run the test suite
        run: bash scripts/test.sh

  # Independent of `test`, not `needs: test` — they answer different questions and a failure in
  # one should not hide the other's answer. `docker build` is what proves check:palette,
  # tsc --noEmit and vite build all pass, because Dockerfile:34 runs `npm run build`, which
  # chains them. That is the whole reason those are not separate steps above.
  #
  # Smoke lives in THIS job rather than its own, deliberately. GitHub jobs do not share a Docker
  # daemon, so a separate smoke job would mean `docker save` → upload-artifact → download →
  # `docker load` for a 185 MB image — more wall-clock than the build itself, to move an image
  # that is already sitting right here. Same coverage, none of the plumbing.
  build:
    name: build the image + smoke it
    runs-on: ubuntu-latest
    # Cold runner: pulls node:22-slim + python:3.12-slim and runs npm ci over Cesium, which is
    # large. Deliberately measured before any cache is added — tune from a real number, not a
    # guess. Raise this only if a real run says to.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Plain `docker build`, no buildx cache actions. The runner ships with Docker, so this adds
      # no new dependency (ground rule 2) and nothing to drift from the local command people
      # actually run. MEASURED at ~35 s cold with zero cached layers, so a cache would buy
      # nothing — do not add one without a number showing otherwise.
      #
      # BUILD_SHA is the provenance stamp: it rides through to LORAN_BUILD_SHA in the runtime
      # stage and out again at /api/health, so `curl -s https://<host>/api/health` answers
      # "what is actually live?" in one command.
      - name: Build the runtime image
        run: docker build --build-arg BUILD_SHA="${{ github.sha }}" -t loran:ci .

      # Prove the image exists and record its size — a build that succeeds but produces nothing
      # usable would otherwise look identical to a real pass.
      - name: Show the built image
        run: docker image inspect loran:ci --format 'built {{.Id}} · {{.Size}} bytes · {{.Created}}'

      # LORAN_ACCESS_TOKENS is deliberately UNSET: auth.py treats "no tokens configured" as the
      # single-user default with no auth at all, so the page is open and there is no secret to
      # inject into a workflow file and nothing to leak from one.
      - name: Boot the image
        run: docker run -d --name loran-ci -p 127.0.0.1:8010:8010 loran:ci

      # scripts/smoke.py needs `websockets` for CDP. Installing the project's own pinned
      # requirements gets it via uvicorn[standard] — the same version the app already ships,
      # rather than a floating one pinned nowhere.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the smoke check's dependencies
        run: pip install -r backend/requirements.txt

      # Asserts, in order: the container reports the commit we just built; the bundle it SERVES
      # is byte-identical to the one inside the image; React mounted; the console is clean.
      # Passes with zero aircraft on purpose — CI must not hit airplanes.live (1 req/s,
      # non-commercial, and it has already 429'd this project).
      #
      # --settle is longer than the local default: SwiftShader renders Cesium in software on a
      # runner, so give late-arriving errors time to surface.
      - name: Smoke the booted image
        run: |
          python3 scripts/smoke.py \
            --base http://127.0.0.1:8010 \
            --container loran-ci \
            --expect-sha "${{ github.sha }}" \
            --settle 20

      # A smoke failure is usually explained by what the app logged, and the container is gone
      # the moment this job ends.
      - name: Container logs (on failure)
        if: failure()
        run: docker logs loran-ci
