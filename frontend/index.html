<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Without this, browsers request /favicon.ico unprompted and 404 on every page load. That is
      a console error on a clean boot, which is precisely the noise that erodes a "fail on any
      console error" smoke check into an allowlist nobody reads. An SVG icon needs no .ico
      fallback for anything current.
    -->
    <!--
      BUMP THE ?v= ON BOTH OF THESE WHENEVER AN ICON CHANGES.

      Cloudflare caches by file extension: svg and png come back with max-age=14400, and unlike
      the Vite bundles these filenames carry no content hash. So a redeployed icon keeps serving
      the OLD bytes from the edge for up to four hours, with the container serving the new ones
      the whole time. That is how a fixed favicon appeared still-broken through the tunnel while
      being correct on 127.0.0.1. This document is cf-cache-status DYNAMIC and never cached, so
      changing the query here is enough to fetch a fresh copy immediately.

      iOS has never supported SVG for a Home Screen icon, and given no apple-touch-icon it makes
      one from a screenshot of the page - an unreadable smudge for a dark globe. The PNG is
      generated from frontend/icons/apple-touch-icon.src.svg by scripts/make-icons.sh.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <title>LORAN</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
