<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Without this, browsers request /favicon.ico unprompted and 404 on every page load. That is
      a console error on a clean boot, which is precisely the noise that erodes a "fail on any
      console error" smoke check into an allowlist nobody reads. An SVG icon needs no .ico
      fallback for anything current.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      iOS has never supported SVG here, and with no apple-touch-icon it makes a Home Screen icon
      out of a screenshot of the page - which for a dark globe is an unreadable smudge. PNG is
      generated from frontend/icons/apple-touch-icon.src.svg by scripts/make-icons.sh.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>LORAN</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
